name: Release

# Push a tag like v0.1.0 (matching CFBundleShortVersionString in
# Resources/Info.plist) to build, test and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Resources/Info.plist." >&2
            exit 1
          fi

      - name: Test
        run: scripts/test.sh

      - name: Package
        run: scripts/package.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Side Touch Bar $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
